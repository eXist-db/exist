name: Update Prethink Context

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write
  packages: read

jobs:
  prethink:
    if: github.repository == 'eXist-db/exist'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Moderne CLI
        env:
          # Pinned to avoid the Maven Central propagation race observed on 2026-05-08, where
          # the parent moderne-cli metadata advertised a release before the platform-specific
          # moderne-cli-linux binary had CDN-synced. Bump intentionally as new releases stabilize.
          MODERNE_CLI_VERSION: '4.4.0'
        run: |
          curl -sSL https://app.moderne.io/cli | bash
          echo "$HOME/.moderne/cli/bin" >> $GITHUB_PATH
          # The installer writes 'version=RELEASE' so every `mod` invocation re-resolves to whatever
          # is currently latest on Maven Central. Replace with the pinned version so subsequent
          # `mod` calls reuse the dist downloaded once and never race a fresh release.
          sed -i "s/^version=RELEASE$/version=${MODERNE_CLI_VERSION}/" \
            "$HOME/.moderne/cli/dist/moderne-wrapper.properties"

      - name: Configure Moderne
        run: |
          mod config moderne edit https://app.moderne.io --token ${{ secrets.MODERNE_TOKEN }}
          mod config recipes jar install io.moderne.recipe:rewrite-prethink:LATEST

      - name: Install eXist-db custom Prethink recipes
        run: |
          mod config recipes artifacts maven add https://maven.pkg.github.com/eXist-db/exist-moderne-recipes \
            --user "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          mod config recipes jar install org.exist.moderne:exist-moderne-recipes:1.0.0

      - uses: ./.github/actions/maven-github-settings
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build LSTs
        run: mod build .

      - name: Run Prethink (deterministic, no AI)
        run: mod run . --recipe io.moderne.prethink.UpdatePrethinkContextStarter

      - name: Apply changes
        run: mod git apply . --last-recipe-run

      - name: Run eXist-db dynamic-invocation coverage recipe
        run: mod run . --recipe org.exist.moderne.XQueryDynamicInvocationCoverage --no-patch

      - name: Merge dynamic-invocation coverage into Prethink context
        run: |
          RUN_DIR=$(ls -td .moderne/run/*/ | head -1)
          python3 - "${RUN_DIR}datatables/org.exist.moderne.XQueryDynamicInvocationCoverageTable.csv.gz" <<'EOF'
          import csv
          import gzip
          import sys

          with gzip.open(sys.argv[1], "rt", newline="") as f:
              data_lines = [l for l in f if not l.startswith("# ")]

          reader = csv.reader(data_lines)
          next(reader)  # repositoryOrigin,repositoryPath,repositoryBranch,sourcePath,className,localName,dynamicallyInvokedInTests,matchingTestPaths
          rows = [row[3:] for row in reader]

          with open(".moderne/context/xquery-dynamic-invocation-coverage.csv", "w", newline="") as f:
              writer = csv.writer(f, lineterminator="\n")
              writer.writerow(["Source path", "Class name", "QName local name",
                                "Dynamically invoked in tests", "Matching test paths"])
              writer.writerows(rows)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .moderne/context/ AGENTS.md
          if git diff --staged --quiet; then
            echo "No Prethink context changes to commit."
            exit 0
          fi
          git commit -m "[ci] Update Prethink context"
          # Concurrent commits to develop between checkout and push caused the 2026-05-04
          # scheduled run to fail with a non-fast-forward rejection. Rebase + bounded retry
          # handles that without forcing or losing the new context updates.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin develop && git push origin HEAD:develop; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 10))
          done
          echo "Push failed after 3 attempts" >&2
          exit 1

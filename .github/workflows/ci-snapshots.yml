name: Publish Snaphots to Github Packages

on:
  push:
    branches:
      - develop
  workflow_dispatch: # Allow manual triggering

jobs:
  publish-snapshots:
    name: Deploy Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/maven-cache
      - uses: ./.github/actions/maven-github-settings
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy SNAPSHOT maven artefacts
        timeout-minutes: 40
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Maven 4 rerun guidance:
          # - Build/module failures can be rerun with: same args + -r verify
          # - For deploy reruns, assume deploy-at-end all-or-nothing behavior and rerun intentionally.
          ./mvnw -V -B --no-transfer-progress -q -DskipTests -Ddependency-check.skip=true -Dmaven.consumer.pom.flatten=true clean deploy

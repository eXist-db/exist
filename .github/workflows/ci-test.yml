name: Test & documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# Cancel superseded runs (e.g. a force-push/amend during review) to free up
# runners, but never cancel a develop/master run in progress so CI history
# stays complete for bisecting regressions.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' }}
env:
  MAVEN_OPTS: -DtrimStackTrace=false
  DEV_JDK: '21'
jobs:
  license:
    name: License check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.DEV_JDK }}
      - uses: ./.github/actions/maven-cache
      - run: mvn -V -B --no-transfer-progress license:check
        timeout-minutes: 10
  test:
    name: ${{ matrix.os }} ${{ matrix.test-type }} (Java ${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest is moving to 26.04, where /tmp is a RAM-backed tmpfs with a ~7.8G quota
        # that the exist-core unit tests exceed. Unpin once the image keeps /tmp on disk:
        # https://github.com/actions/runner-images/issues/14777
        os: [ubuntu-24.04, windows-latest, macOS-latest]
        test-type: [unit, integration]
        java-version: ['21']
        exclude:
          - os: windows-latest
            test-type: unit
          - os: macOS-latest
            test-type: unit
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: ./.github/actions/maven-cache
        with:
          java-version: ${{ matrix.java-version }}
      - uses: ./.github/actions/maven-github-settings
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Maven Daemon
        id: install-mvnd
        uses: ./.github/actions/install-mvnd
        with:
          version: '1.0.6'
          file-version-suffix: ''
          cache: 'true'
      - name: Maven Build
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: ${{ env.MAVEN_OPTS }} -D'aether.connector.basic.connectTimeout=10000' -D'aether.connector.basic.requestTimeout=30000'
        run: ${{ steps.install-mvnd.outputs.mvnd-dir }}/mvnd -V -B --no-transfer-progress -T 1C compile test-compile -Ponnx-model -D'dependency-check.skip' -D'license.skip'
      - name: Maven Unit Tests
        id: unit-tests
        if: matrix.test-type == 'unit'
        timeout-minutes: 45
        run: ${{ steps.install-mvnd.outputs.mvnd-dir }}/mvnd -V -B --no-transfer-progress test -D'dependency-check.skip' -D'license.skip' -D'mvnd.maxLostKeepAlive=6000'
      - name: Dependency tree on unit test failure
        if: always() && matrix.test-type == 'unit' && steps.unit-tests.outcome == 'failure'
        run: |
          ${{ steps.install-mvnd.outputs.mvnd-dir }}/mvnd -V -B --no-transfer-progress dependency:tree -pl extensions/indexes/lucene -DtrimStackTrace=false -D'dependency-check.skip' -D'license.skip' | tee dependency-tree-lucene.txt
          echo "--- Lucene-related dependencies ---"
          grep -i lucene dependency-tree-lucene.txt || true
      - name: Maven Integration Tests
        if: matrix.test-type == 'integration'
        timeout-minutes: 45
        run: ${{ steps.install-mvnd.outputs.mvnd-dir }}/mvnd -V -B --no-transfer-progress verify "-Ponnx-model,!mac-dmg-on-mac" -DskipUnitTests=true -D'dependency-check.skip' -D'license.skip' -D'mvnd.maxLostKeepAlive=6000'
      - name: Javadoc (ubuntu unit only)
        if: matrix.os == 'ubuntu-24.04' && matrix.test-type == 'unit'
        run: ${{ steps.install-mvnd.outputs.mvnd-dir }}/mvnd -V -B --no-transfer-progress -q -T 1C install javadoc:javadoc -DskipTests -D'dependency-check.skip' -D'license.skip' --projects '!exist-distribution' --also-make
      - name: Maven Code Coverage (Develop branch, ubuntu unit only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && matrix.os == 'ubuntu-24.04' && matrix.test-type == 'unit'
        run: ${{ steps.install-mvnd.outputs.mvnd-dir }}/mvnd -V -B --no-transfer-progress jacoco:report
      # JaCoCo names each source file by its package only (org/exist/...), but this is a
      # multi-module build: prefix each module's source root so Coveralls can find the files.
      - name: Prepare JaCoCo reports for Coveralls (Develop branch, ubuntu unit only)
        id: jacoco-reports
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && matrix.os == 'ubuntu-24.04' && matrix.test-type == 'unit'
        run: |
          files=""
          for report in $(find . -path '*/target/site/jacoco/jacoco.xml'); do
            module="${report#./}"
            module="${module%/target/site/jacoco/jacoco.xml}"
            [ -d "${module}/src/main/java" ] || continue
            sed -i "s#<package name=\"#<package name=\"${module}/src/main/java/#g" "${report}"
            files="${files} ${report}"
          done
          if [ -z "${files}" ]; then
            echo "::error::No JaCoCo reports found"
            exit 1
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
      - name: Upload Code Coverage to Coveralls (Develop branch, ubuntu unit only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && matrix.os == 'ubuntu-24.04' && matrix.test-type == 'unit'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.jacoco-reports.outputs.files }}
          format: jacoco
          flag-name: unit
          fail-on-error: true
      - name: Save Maven cache
        if: github.event_name == 'push' && matrix.os == 'ubuntu-24.04' && matrix.test-type == 'unit'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2
          key: maven-${{ github.ref_name }}-java${{ matrix.java-version }}-${{ hashFiles('**/pom.xml') }}
          enableCrossOsArchive: true
      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ matrix.test-type }}-java${{ matrix.java-version }}-build-logs
          retention-days: 5
          path: |
            **/hs_err_pid*.log
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
            dependency-tree-lucene.txt

name: WebDAV Compliance

on:
  push:
    paths:
      - 'extensions/webdav/**'
      - 'exist-distribution/**'
      - '.github/workflows/webdav-compliance.yml'
  pull_request:
    paths:
      - 'extensions/webdav/**'
      - 'exist-distribution/**'
      - '.github/workflows/webdav-compliance.yml'
  workflow_dispatch:

jobs:
  litmus:
    name: Litmus WebDAV Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '21'

      - uses: ./.github/actions/maven-cache

      - uses: ./.github/actions/maven-github-settings
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build eXist Docker image
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -V -B --no-transfer-progress -q
          -Pdocker -DskipTests -Ddependency-check.skip=true
          -P !mac-dmg-on-unix,!installer,!concurrency-stress-tests,!micro-benchmarks,skip-build-dist-archives
          clean package

      - name: Start eXist container
        run: |
          docker run -dit -p 8080:8080 --name exist-webdav --rm existdb/existdb:latest
          echo "Waiting for eXist to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/exist/ > /dev/null 2>&1; then
              echo "eXist is ready (attempt $i)"
              break
            fi
            sleep 2
          done
          # Verify WebDAV endpoint
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -u admin: -X PROPFIND http://localhost:8080/exist/webdav/db/)
          if [ "$STATUS" != "207" ]; then
            echo "::error::WebDAV endpoint not responding (HTTP $STATUS)"
            docker logs exist-webdav | tail -50
            exit 1
          fi
          echo "WebDAV endpoint responding (HTTP $STATUS)"

      - name: Build litmus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libneon27-dev autoconf automake libtool > /dev/null
          # Pin to the latest released tag (--branch 0.17, June 2025) rather than
          # tracking notroj/litmus master, which broke autoreconf on 2026-05-13.
          # --recurse-submodules pulls the neon submodule whose m4 macros
          # (NE_MINIMUM_VERSION, NEON_VPATH_BUNDLED, etc.) configure.ac references.
          git clone --branch 0.17 --recurse-submodules \
              https://github.com/notroj/litmus.git /tmp/litmus
          cd /tmp/litmus
          # Use litmus's own autogen.sh — it runs `aclocal -I neon/macros` so the
          # NE_* macros are found before autoconf. Bare `autoreconf -i` does not
          # search neon/macros and leaves NE_MINIMUM_VERSION unexpanded, which then
          # fails at configure time with a shell syntax error.
          # Use system libneon (installed above) via --with-neon, matching
          # upstream's CI matrix.
          ./autogen.sh
          ./configure --quiet --with-neon
          make -s

      - name: Run litmus
        id: litmus
        run: |
          cd /tmp/litmus
          # Run each section separately to capture full output even if one crashes
          {
            ./basic http://localhost:8080/exist/webdav/db/ admin "" 2>&1 || true
            echo ""
            ./copymove http://localhost:8080/exist/webdav/db/ admin "" 2>&1 || true
            echo ""
            ./props http://localhost:8080/exist/webdav/db/ admin "" 2>&1 || true
            echo ""
            # Clean stale locks between sections
            curl -s -u admin: -X DELETE http://localhost:8080/exist/webdav/db/litmus/ -o /dev/null 2>/dev/null || true
            curl -s -u admin: -X DELETE http://localhost:8080/exist/webdav/db/system/webdav-locks/ -o /dev/null 2>/dev/null || true
            sleep 1
            ./locks http://localhost:8080/exist/webdav/db/ admin "" 2>&1 || true
          } | tee /tmp/litmus-results.txt

      - name: Check results against baseline
        run: |
          bash extensions/webdav/src/test/resources/litmus-check.sh \
            /tmp/litmus-results.txt \
            extensions/webdav/src/test/resources/litmus-baseline.txt

      - name: Upload litmus results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litmus-results
          path: /tmp/litmus-results.txt

      - name: Debug logs on failure
        if: failure()
        run: |
          echo "=== eXist logs ==="
          docker logs exist-webdav 2>&1 | tail -100
          echo ""
          echo "=== Litmus debug log ==="
          cat /tmp/litmus/debug.log 2>/dev/null || echo "(no debug log)"

      - name: Stop container
        if: always()
        run: docker stop exist-webdav 2>/dev/null || true

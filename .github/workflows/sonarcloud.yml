name: SonarCloud
on:
  push:
    branches:
      - develop
      - master
# Serialize rather than cancel: dropping analysis of an actual merged commit
# loses history, but two analyses racing against the same SonarCloud project
# can corrupt its incremental state, so back-to-back pushes queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonarcloud-${{ runner.os }}-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: sonarcloud-${{ runner.os }}-cache
      - uses: ./.github/actions/maven-cache
      - name: Analyze
        timeout-minutes: 55
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Static analysis only, no test run: ci-test.yml already runs the full suite on
        # every push, so re-running it here just duplicates the work and lets flaky tests
        # abort this build before sonar:sonar ever executes.
        # -DskipTests covers modules using the standard skip property (incl. failsafe ITs);
        # exist-core's surefire execution is bound to -DskipUnitTests instead, so both are
        # needed. This build no longer reports coverage to SonarCloud; coverage is already
        # tracked via Coveralls from ci-test.yml's ubuntu/unit leg.
        run: mvn -V -B --no-transfer-progress -Ddependency-check.skip=true -Ddocker=false -Pskip-build-dist-archives -DskipTests -DskipUnitTests=true verify site org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

name: SonarCloud
on:
  push:
    branches:
      - develop
      - master
jobs:
  build:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: sonarcloud-${{ runner.os }}-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: sonarcloud-${{ runner.os }}-cache
      - uses: ./.github/actions/maven-cache
      - name: Analyze
        timeout-minutes: 55
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -V -B --no-transfer-progress -Dsurefire.useFile=false -DtrimStackTrace=false -Ddependency-check.skip=true -Ddocker=false -Plocal-build verify site org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
